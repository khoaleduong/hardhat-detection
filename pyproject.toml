[project]
name = "hardhat-detection"
version = "0.1.0"
description = "Hardhat detection using Faster R-CNN"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch",
    "torchvision",
    "opencv-python>=4.8.0",
    "albumentations==1.4.21",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "torchmetrics>=1.9.0",
    "pytest>=9.1.1",
    "matplotlib>=3.10.9",
    "roboflow>=1.3.13",
    "python-dotenv>=1.2.3",
    "tensorboard>=2.21.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]

markers = [
    "slow: slow tests",
]


[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
